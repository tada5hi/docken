<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="docken-title docken-desc">
<title id="docken-title">Progress stream dispatch</title><desc id="docken-desc">waitForStream delegates to the Docker modem, dispatches chunks to specific progress callbacks before generic callbacks, and resolves output or rejects the completion error. Callback promises are not awaited.</desc>
<style>:root{--panel:#f5f7fa;--ink:#172536;--line:#718294;--accent:#3586b3}@media(prefers-color-scheme:dark){:root{--panel:#182431;--ink:#edf3f8;--line:#a3b1bf}}text{font-family:system-ui,sans-serif;fill:var(--ink)}.card{fill:var(--panel);stroke:var(--accent);stroke-width:2}.arrow{stroke:var(--line);stroke-width:3;fill:none}</style>
<rect x="1" y="1" width="958" height="238" rx="16" fill="var(--panel)"/>
<text x="36" y="44" font-size="22" font-weight="700">Progress stream dispatch</text>
<path class="arrow" d="M304 140h30m-8-7 8 7-8 7M624 140h30m-8-7 8 7-8 7"/>
<rect class="card" x="24" y="80" width="272" height="112" rx="12"/><text x="42" y="122" font-size="19" font-weight="650">Docker modem</text><text x="42" y="157" font-size="16">followProgress(stream)</text>
<rect class="card" x="344" y="80" width="272" height="112" rx="12"/><text x="362" y="122" font-size="19" font-weight="650">Specific callback</text><text x="362" y="157" font-size="16">download / push / build</text>
<rect class="card" x="664" y="80" width="272" height="112" rx="12"/><text x="682" y="122" font-size="19" font-weight="650">Completion</text><text x="682" y="157" font-size="16">reject error or resolve output</text>
</svg>
