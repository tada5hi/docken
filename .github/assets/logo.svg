<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="docken-b-title docken-b-desc">
<title id="docken-b-title">Docken — Image harbour</title>
<desc id="docken-b-desc">A stack of image layers rests in a hull-shaped cradle above a daemon signal.</desc>
<style>
:root{--accent:#3586b3;--second:#bc9145;--ink:#253447;--paper:#f7fafc;--line:#8394a7;--wash:#3586b318}
